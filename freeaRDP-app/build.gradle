apply plugin: 'com.android.application'

def foldVersion = 'v6.5.0-fold.34'
def foldBuildDate = java.time.LocalDate.now(java.time.ZoneOffset.UTC)

android {
    ndkVersion '27.2.12479018'
    compileSdkVersion compileApi

    defaultConfig {
        applicationId 'com.foldable.rdp'
        versionName foldVersion
        versionCode 116533
        resValue 'string', 'fold_build_label', "${foldVersion} · ${foldBuildDate}"
        targetSdkVersion targetApi
        minSdkVersion project.getProperties().get("SDK_VERSION")
        multiDexEnabled true
    }

    buildFeatures {
        resValues = true
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }

    packaging {
        jniLibs {
            excludes += ['**/libspice.so', '**/libgstreamer_android.so']
        }
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    namespace 'com.iiordanov.freeaRDP'
    lint {
        disable 'Instantiatable'
    }
}

dependencies {
    api 'com.android.support:multidex:1.0.3'
    implementation project(':bVNC')
    implementation project(':pubkeyGenerator')
}
