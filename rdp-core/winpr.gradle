// Keep the FreeRDP 2.11.7 binary ABI, and build its Android storage fix for each packaged ABI.
def version = '2.11.7'
def sha256 = '22dbeeaad065e93f152d70e04ec8eeab08aa32c406a96be64f252526623625a4'
def work = layout.buildDirectory.dir('winpr')
def source = work.map { it.dir("FreeRDP-${version}") }
def patch = file('winpr-android.patch')
def deps = rootProject.file('remoteClientLib/jni/libs/deps/FreeRDP/client/Android/Studio/freeRDPCore/src/main/jniLibs')
def sourcePaths = file('source-paths.cmake')
def abis = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
def sdk = androidComponents.sdkComponents.sdkDirectory
def executable = System.getProperty('os.name').startsWith('Windows') ? '.exe' : ''
def cmakeDir = sdk.map { it.dir('cmake/3.22.1/bin') }
def toolchain = sdk.map { it.file('ndk/27.2.12479018/build/cmake/android.toolchain.cmake') }

def prepare = tasks.register('preparePhoneWinpr') {
    inputs.file(patch)
    inputs.property('archive', sha256)
    outputs.dir(source)
    doLast {
        def cache = new File(gradle.gradleUserHomeDir, "caches/foldable-rdp/FreeRDP-${sha256}.tar.gz")
        cache.parentFile.mkdirs()
        def checksum = { File f ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            f.withInputStream { input -> new java.security.DigestInputStream(input, digest).transferTo(OutputStream.nullOutputStream()) }
            digest.digest().encodeHex().toString()
        }
        if (!cache.isFile() || checksum(cache) != sha256) {
            def tmp = File.createTempFile('freerdp-', '.part', cache.parentFile)
            try {
                def connection = new URI("https://codeload.github.com/FreeRDP/FreeRDP/tar.gz/refs/tags/${version}").toURL().openConnection()
                connection.connectTimeout = 30000
                connection.readTimeout = 60000
                connection.inputStream.withCloseable { input -> tmp.withOutputStream { input.transferTo(it) } }
                if (checksum(tmp) != sha256) throw new GradleException('FreeRDP source checksum mismatch')
                java.nio.file.Files.move(tmp.toPath(), cache.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } finally { tmp.delete() }
        }
        def dir = work.get().asFile
        dir.mkdirs()
        providers.exec {
            workingDir dir
            commandLine cmakeDir.get().file("cmake${executable}").asFile, '-E', 'tar', 'xzf', cache
        }.result.get()
        providers.exec {
            workingDir source.get().asFile
            commandLine 'git', 'apply', '--no-index', '--whitespace=nowarn', patch
        }.result.get()
    }
}

def nativeTasks = abis.collect { abi ->
    tasks.register("buildPhoneWinpr${abi.replaceAll('[^A-Za-z0-9]', '')}") {
        dependsOn prepare
        inputs.dir(source)
        inputs.file(sourcePaths)
        inputs.file(file('winpr.gradle'))
        inputs.file(toolchain)
        def libs = new File(deps, abi)
        inputs.files(new File(libs, 'include/openssl'), new File(libs, 'libssl.so'), new File(libs, 'libcrypto.so'))
        def obj = work.map { it.dir("obj/${abi}") }
        def output = obj.map { it.file('winpr/libwinpr/libwinpr2.so') }
        outputs.file(output)
        doLast {
            def cmake = cmakeDir.get().file("cmake${executable}").asFile
            def libPath = libs.absolutePath.replace('\\', '/')
            def configure = providers.exec {
                ignoreExitValue = true
                commandLine cmake, '-S', source.get().asFile, '-B', obj.get().asFile, '-G', 'Ninja',
                    "-DCMAKE_MAKE_PROGRAM=${cmakeDir.get().file("ninja${executable}").asFile}",
                    "-DCMAKE_TOOLCHAIN_FILE=${toolchain.get().asFile}", "-DANDROID_ABI=${abi}",
                    "-DCMAKE_PROJECT_INCLUDE:FILEPATH=${sourcePaths.absolutePath.replace('\\', '/')}", '-DANDROID_PLATFORM=android-21', '-DCMAKE_BUILD_TYPE=Release',
                    "-DOPENSSL_INCLUDE_DIR=${libPath}/include", "-DSSL_LIBRARY=${libPath}/libssl.so",
                    "-DCRYPTO_LIBRARY=${libPath}/libcrypto.so", '-DWITH_CLIENT=OFF', '-DWITH_CHANNELS=OFF',
                    '-DWITH_SERVER=OFF', '-DWITH_OPENH264=OFF', '-DWITH_FFMPEG=OFF', '-DBUILD_TESTING=OFF',
                    '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384'
            }
            if (configure.result.get().exitValue != 0) {
                throw new GradleException("WinPR configuration failed for ${abi}:\n" +
                    configure.standardError.asText.get() + configure.standardOutput.asText.get())
            }
            providers.exec { commandLine cmake, '--build', obj.get().asFile, '--target', 'winpr', '--parallel', '4' }.result.get()
        }
    }
}

tasks.register('stagePhoneJni', Sync) {
    from(deps) { include '**/*.so'; exclude '**/libwinpr2.so' }
    abis.eachWithIndex { abi, i -> from(nativeTasks[i]) { into abi } }
    into layout.buildDirectory.dir('phone-jni')
}
